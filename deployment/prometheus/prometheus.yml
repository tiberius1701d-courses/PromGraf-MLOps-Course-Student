global:
  scrape_interval: 15s # Frequency at which Prometheus will scrape metrics
  evaluation_interval: 15s # Frequency at which alert and recording rules are evaluated

# Indicate to Prometheus where to find the rule files
rule_files:
  - "rules/*.yml" # Load every .yml file in the 'rules' subdirectory

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "news_classifier_api"
    static_configs:
      - targets: ["news-classifier-api:8080"]
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
